[project]
name = "obsidian-mcp"
version = "0.1.0"
description = "Python MCP server for Obsidian vault access"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0",
]

[project.scripts]
obsidian-mcp = "obsidian_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_mcp"]
